services:
  - type: web
    name: stundenerfassung
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: DATABASE_PATH
        value: /data/stundenerfassung.db
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
