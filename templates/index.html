<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1a56db">
<title>Stundenerfassung</title>
<style>
  :root {
    --primary: #1a56db;
    --primary-dark: #1240a8;
    --primary-light: #e8f0fe;
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1a1f36;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --red: #ef4444;
    --green: #10b981;
    --radius: 14px;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overscroll-behavior: none;
  }

  /* ── SCREENS ── */
  .screen { display: none; flex-direction: column; min-height: 100vh; }
  .screen.active { display: flex; }

  /* ── EMPLOYEE SELECT ── */
  #screen-employee {
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    background: linear-gradient(160deg, #1a56db 0%, #0c3399 100%);
  }

  .logo-area { text-align: center; margin-bottom: 48px; }
  .brand-logo { width: 230px; max-width: 72%; height: auto; display: block; margin: 0 auto 22px; }
  .logo-area h1 { font-size: 26px; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
  .logo-area p { color: rgba(255,255,255,0.7); margin-top: 6px; font-size: 15px; }

  .employee-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: 100%;
    max-width: 340px;
  }

  .employee-btn {
    background: rgba(255,255,255,0.12);
    border: 1.5px solid rgba(255,255,255,0.25);
    border-radius: var(--radius);
    padding: 20px 16px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    color: #fff;
  }
  .employee-btn:active { transform: scale(0.96); background: rgba(255,255,255,0.22); }
  .employee-btn .kuerzel { font-size: 22px; font-weight: 700; display: block; }
  .employee-btn .fullname { font-size: 12px; color: rgba(255,255,255,0.75); margin-top: 4px; display: block; }

  /* ── MAIN APP ── */
  #screen-main { background: var(--bg); }

  /* Header */
  .app-header {
    background: var(--primary);
    padding: 0;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 10px;
    min-height: 56px;
  }

  /* KW Overview header: title left, chip right */
  .header-top .app-title {
    font-size: 17px;
    font-weight: 600;
    color: rgba(255,255,255,0.85);
  }

  /* Week view header: back left, title center, empty right */
  .header-back-btn {
    background: none;
    border: none;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    padding: 6px 0;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: opacity 0.15s;
    white-space: nowrap;
  }
  .header-back-btn:active { opacity: 0.7; }

  .header-center-title {
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    text-align: center;
    flex: 1;
  }

  .header-right-placeholder {
    /* matches width of back button side to keep title centered */
    min-width: 90px;
  }

  .employee-chip {
    background: rgba(255,255,255,0.2);
    border: none;
    color: #fff;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  .employee-chip:active { background: rgba(255,255,255,0.3); }

  /* Date Navigation row (only in week view) */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px 12px;
  }

  .nav-btn {
    background: rgba(255,255,255,0.15);
    border: none;
    color: #fff;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  .nav-btn:active { background: rgba(255,255,255,0.3); }
  .nav-btn:disabled { opacity: 0.35; cursor: default; }

  .date-display {
    text-align: center;
    color: #fff;
  }
  .date-display .date-main {
    font-size: 15px;
    font-weight: 600;
    display: block;
    color: rgba(255,255,255,0.9);
  }

  /* Content */
  .content {
    flex: 1;
    padding: 16px;
    padding-bottom: 100px;
  }

  /* ── KW OVERVIEW ── */
  .kw-overview-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 14px;
    padding: 0 2px;
  }

  .kw-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
    -webkit-user-select: none;
    user-select: none;
    border: 1.5px solid transparent;
  }
  .kw-card:active {
    transform: scale(0.985);
    box-shadow: 0 1px 6px rgba(0,0,0,0.07);
  }
  .kw-card-left {}
  .kw-card-label {
    font-size: 18px;
    font-weight: 700;
    color: var(--primary);
    display: block;
    margin-bottom: 4px;
  }
  .kw-card-range {
    font-size: 13px;
    color: var(--text-muted);
    display: block;
  }
  .kw-card-arrow {
    font-size: 20px;
    color: var(--primary);
    opacity: 0.6;
  }

  /* No weeks message */
  .no-weeks-msg {
    text-align: center;
    padding: 60px 24px;
    color: var(--text-muted);
  }
  .no-weeks-msg .icon {
    font-size: 48px;
    margin-bottom: 16px;
  }
  .no-weeks-msg p {
    font-size: 15px;
    line-height: 1.6;
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 15px; }

  /* ── WEEK VIEW ── */
  .week-day-block {
    background: var(--card);
    border-radius: var(--radius);
    margin-bottom: 10px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .week-day-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  .week-day-header.today { background: var(--primary-light); }
  .week-day-label { font-size: 14px; font-weight: 700; color: var(--text); }
  .week-day-label.today-label { color: var(--primary); }
  .week-day-date { font-size: 12px; color: var(--text-muted); }
  .week-day-badge {
    background: var(--primary);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    min-width: 22px;
    text-align: center;
  }
  .week-day-badge.empty { background: var(--border); color: var(--text-muted); }
  .week-day-entries { padding: 8px 12px 4px; }
  .week-entry-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 4px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    cursor: pointer;
    transition: background 0.1s;
    border-radius: 6px;
    margin: 0 -4px;
    padding-left: 8px;
    padding-right: 8px;
  }
  .week-entry-row:last-child { border-bottom: none; }
  .week-entry-row:active { background: var(--primary-light); }
  .week-entry-time { color: var(--primary); font-weight: 700; min-width: 80px; font-size: 12px; flex-shrink: 0; }
  .week-entry-info { flex: 1; min-width: 0; }
  .week-entry-customer { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .week-entry-act { font-size: 11px; color: var(--text-muted); }
  .week-empty { padding: 10px 4px; color: var(--text-muted); font-size: 13px; text-align: center; }
  .week-add-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    padding: 11px;
    background: none;
    border: none;
    color: var(--primary);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    border-top: 1px solid var(--border);
    transition: background 0.1s;
  }
  .week-add-btn:active { background: var(--primary-light); }

  /* FAB */
  .fab {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: var(--primary);
    border: none;
    color: #fff;
    font-size: 30px;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(26,86,219,0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .fab:active { transform: scale(0.92); box-shadow: 0 2px 10px rgba(26,86,219,0.4); }

  /* ── MODAL / BOTTOM SHEET ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 300;
    align-items: flex-end;
  }
  .modal-overlay.open { display: flex; }

  .modal-sheet {
    background: var(--card);
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-height: 92vh;
    overflow-y: auto;
    padding: 0 0 40px;
    animation: slideUp 0.25s ease-out;
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .modal-handle {
    width: 40px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 12px auto 8px;
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 20px 16px;
    border-bottom: 1px solid var(--border);
  }
  .modal-header h2 { font-size: 18px; font-weight: 700; }
  .close-btn {
    background: var(--bg);
    border: none;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
  }

  .modal-body { padding: 20px; }

  /* Form */
  .form-group { margin-bottom: 18px; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  input[type="text"],
  input[type="time"],
  select,
  textarea {
    width: 100%;
    padding: 14px 16px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 16px;
    font-family: inherit;
    background: #fff;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
    appearance: none;
    -webkit-appearance: none;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(26,86,219,0.1);
  }

  textarea { resize: none; height: 80px; }

  /* Customer search */
  .customer-search-wrap { position: relative; }
  #customer-results {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: var(--card);
    border: 1.5px solid var(--primary);
    border-top: none;
    border-radius: 0 0 10px 10px;
    max-height: 220px;
    overflow-y: auto;
    z-index: 50;
    display: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  }
  .customer-result-item {
    padding: 13px 16px;
    cursor: pointer;
    font-size: 15px;
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }
  .customer-result-item:last-child { border-bottom: none; }
  .customer-result-item:active { background: var(--primary-light); }

  /* Time row */
  .time-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  /* Pause quick buttons */
  .pause-row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-top: 6px;
  }
  .pause-btn {
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 10px 4px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    color: var(--text);
  }
  .pause-btn.active {
    background: var(--primary-light);
    border-color: var(--primary);
    color: var(--primary);
  }
  .pause-btn:active { transform: scale(0.94); }

  /* Action buttons */
  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }

  .btn-primary {
    flex: 1;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 16px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s;
  }
  .btn-primary:active { background: var(--primary-dark); }

  .btn-danger {
    background: #fff;
    color: var(--red);
    border: 1.5px solid var(--red);
    border-radius: 12px;
    padding: 16px 20px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s;
  }
  .btn-danger:active { background: #fef2f2; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1a1f36;
    color: #fff;
    padding: 12px 24px;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 500;
    z-index: 999;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Loading spinner */
  .spinner {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Date picker hidden input */
  #date-picker-input {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
    pointer-events: none;
  }

  /* Synced/unsynced dots (used in entry rendering) */
  .synced-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
    margin-top: 4px;
    flex-shrink: 0;
  }
  .unsynced-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--border);
    margin-top: 4px;
    flex-shrink: 0;
  }
</style>
</head>

<!-- ── MAIN APP SCREEN ── -->
<div id="screen-main" class="screen">

  <!-- Header: KW Overview mode (default) -->
  <div class="app-header" id="header-overview">
    <div class="header-top">
      <span class="app-title">Stundenerfassung</span>
      <button class="employee-chip" onclick="changeEmployee()">
        <span id="header-kuerzel">--</span>
      </button>
    </div>
  </div>

  <!-- Header: Week view mode (hidden until KW selected) -->
  <div class="app-header" id="header-weekview" style="display:none">
    <div class="header-top">
      <button class="header-back-btn" onclick="showKWOverview()">&#8592; Übersicht</button>
      <span class="header-center-title" id="weekview-kw-title">KW -- / ----</span>
      <div class="header-right-placeholder"></div>
    </div>
    <div class="date-nav">
      <button class="nav-btn" id="nav-prev-kw" onclick="navigateKW(-1)">&#8249;</button>
      <div class="date-display">
        <span class="date-main" id="weekview-date-range">--</span>
      </div>
      <button class="nav-btn" id="nav-next-kw" onclick="navigateKW(1)">&#8250;</button>
    </div>
  </div>

  <!-- KW Overview content -->
  <div class="content" id="kw-overview-content">
    <div class="empty-state">
      <div class="icon">&#8987;</div>
      <p>Lade&#8230;</p>
    </div>
  </div>

  <!-- Week view content (hidden until KW selected) -->
  <div class="content" id="week-view-content" style="display:none"></div>

  <!-- FAB: only visible in week view -->
  <button class="fab" id="fab-btn" onclick="openNewEntry()" style="display:none">+</button>

  <input type="date" id="date-picker-input">
</div>

<!-- ── ENTRY MODAL ── -->
<div class="modal-overlay" id="entry-modal" onclick="handleOverlayClick(event)">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <h2 id="modal-title">Neuer Eintrag</h2>
      <button class="close-btn" onclick="closeModal()">&#10005;</button>
    </div>
    <div class="modal-body">
      <form id="entry-form" onsubmit="saveEntry(event)">

        <!-- Customer -->
        <div class="form-group">
          <label>Kundenname</label>
          <div class="customer-search-wrap">
            <input type="text" id="f-kundenname" placeholder="Kunden suchen&#8230;"
                   autocomplete="off" oninput="searchCustomers(this.value)"
                   onfocus="searchCustomers(this.value)">
            <div id="customer-results"></div>
          </div>
          <input type="hidden" id="f-kunden-id">
        </div>

        <!-- Activity -->
        <div class="form-group">
          <label>Aktivität</label>
          <select id="f-aktivitaet">
            <option value="">-- Wählen --</option>
          </select>
          <input type="hidden" id="f-akt-code">
        </div>

        <!-- Comment -->
        <div class="form-group">
          <label>Was wurde gemacht?</label>
          <textarea id="f-kommentar" placeholder="Kurze Beschreibung der Arbeit&#8230;"></textarea>
        </div>

        <!-- Times -->
        <div class="form-group">
          <label>Von / Bis</label>
          <div class="time-row">
            <input type="time" id="f-von" step="300" onchange="snapTo5(this)">
            <input type="time" id="f-bis" step="300" onchange="snapTo5(this)">
          </div>
        </div>

        <!-- Pause -->
        <div class="form-group">
          <label>Pause (Minuten)</label>
          <div class="pause-row">
            <button type="button" class="pause-btn" onclick="setPause(0)">0</button>
            <button type="button" class="pause-btn" onclick="setPause(15)">15</button>
            <button type="button" class="pause-btn" onclick="setPause(30)">30</button>
            <button type="button" class="pause-btn" onclick="setPause(45)">45</button>
            <button type="button" class="pause-btn" onclick="setPause(60)">60</button>
          </div>
          <input type="hidden" id="f-pause" value="0">
        </div>

        <div class="btn-row">
          <button type="button" class="btn-danger" id="delete-btn"
                  onclick="deleteEntry()" style="display:none">Löschen</button>
          <button type="submit" class="btn-primary" id="save-btn">Speichern</button>
        </div>

      </form>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ── State ────────────────────────────────────────────────────────────────────
let currentEmployee = null;
let currentDate = todayStr();
let editingEntryId = null;
let allCustomers = [];
let allActivities = [];
let currentEntries = []; // entries for currently open modal's day context
let availableWeeks = [];
let currentWeek = null; // { year, week } of the currently displayed week view

// ── Init ─────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
  const saved = localStorage.getItem('employee');
  await loadStaticData();
  if (saved) {
    selectEmployee(JSON.parse(saved));
  } else {
    await renderEmployeeGrid();
  }
});

// ── Static Data ───────────────────────────────────────────────────────────────
async function loadStaticData() {
  try {
    const [customers, activities] = await Promise.all([
      fetch('/api/customers').then(r => r.json()),
      fetch('/api/activities').then(r => r.json())
    ]);
    allCustomers = customers;
    allActivities = activities;

    const sel = document.getElementById('f-aktivitaet');
    sel.innerHTML = '<option value="">-- Wählen --</option>';
    activities.forEach(a => {
      const opt = document.createElement('option');
      opt.value = a.name;
      opt.dataset.code = a.code;
      opt.textContent = a.name;
      sel.appendChild(opt);
    });
  } catch (e) {
    // continue even if static data fails
  }
}

// ── Employee ──────────────────────────────────────────────────────────────────
async function renderEmployeeGrid() {
  const employees = await fetch('/api/employees').then(r => r.json());
  const grid = document.getElementById('employee-grid');
  grid.innerHTML = '';
  employees.forEach(emp => {
    const btn = document.createElement('button');
    btn.className = 'employee-btn';
    btn.innerHTML = `<span class="kuerzel">${emp.id}</span><span class="fullname">${emp.name}</span>`;
    btn.onclick = () => selectEmployee(emp);
    grid.appendChild(btn);
  });
}

async function selectEmployee(emp) {
  currentEmployee = emp;
  localStorage.setItem('employee', JSON.stringify(emp));
  document.getElementById('header-kuerzel').textContent = emp.id;
  showScreen('main');
  // Load KW overview
  await fetchAvailableWeeks();
  renderKWOverview();
}

function changeEmployee() {
  localStorage.removeItem('employee');
  currentEmployee = null;
  currentWeek = null;
  availableWeeks = [];
  renderEmployeeGrid();
  showScreen('employee');
}

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
}

// ── Available Weeks ───────────────────────────────────────────────────────────
async function fetchAvailableWeeks() {
  try {
    const data = await fetch(`/api/available-weeks?employee=${currentEmployee.id}`).then(r => r.json());
    availableWeeks = Array.isArray(data) ? data : [];
  } catch (e) {
    availableWeeks = [];
  }
}

// ── KW Overview ───────────────────────────────────────────────────────────────
async function renderKWOverview() {
  // Show overview header, hide week view header
  document.getElementById('header-overview').style.display = '';
  document.getElementById('header-weekview').style.display = 'none';

  // Show overview content, hide week view content
  document.getElementById('kw-overview-content').style.display = '';
  document.getElementById('week-view-content').style.display = 'none';

  // Hide FAB in overview
  document.getElementById('fab-btn').style.display = 'none';

  const container = document.getElementById('kw-overview-content');

  if (!availableWeeks.length) {
    container.innerHTML = `
      <div class="no-weeks-msg">
        <div class="icon">&#128194;</div>
        <p>Keine Stundenblätter gefunden.<br>Bitte Sync ausführen.</p>
      </div>`;
    return;
  }

  // Sort weeks ascending
  const sorted = [...availableWeeks].sort((a, b) =>
    a.year !== b.year ? a.year - b.year : a.week - b.week
  );

  const hoursMap = {};
  await Promise.all(sorted.map(async aw => {
    try {
      const es = await fetch(`/api/entries/week?employee=${currentEmployee.id}&year=${aw.year}&week=${aw.week}`).then(r => r.json());
      let mins = 0;
      es.forEach(e => {
        const v = toMinutes(e.von), b = toMinutes(e.bis);
        if (v === null || b === null) return;
        let m = b - v; if (m < 0) m += 1440; m -= (e.pause || 0);
        if (m > 0) mins += m;
      });
      hoursMap[`${aw.year}-${aw.week}`] = mins;
    } catch (err) { hoursMap[`${aw.year}-${aw.week}`] = 0; }
  }));

  let html = '<div class="kw-overview-title">Meine Kalenderwochen</div>';
  container.innerHTML = html;

  sorted.forEach(aw => {
    const monday = getMondayOfWeek(aw.year, aw.week);
    const sunday = getWeekDates(monday)[6];
    const range = formatDateRange(monday, sunday);

    const card = document.createElement('div');
    card.className = 'kw-card';
    card.innerHTML = `
      <div class="kw-card-left">
        <span class="kw-card-label">KW ${String(aw.week).padStart(2, '0')} / ${aw.year}</span>
        <span class="kw-card-range">${range}</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <span style="font-size:15px;font-weight:700;color:var(--text);white-space:nowrap;">${((hoursMap[`${aw.year}-${aw.week}`] || 0) / 60).toFixed(1).replace('.', ',')} Std</span>
        <span class="kw-card-arrow">&#8594;</span>
      </div>
    `;
    card.onclick = () => openWeekView(aw.year, aw.week);
    container.appendChild(card);
  });
}

function showKWOverview() {
  currentWeek = null;
  renderKWOverview();
}

// ── Week View ─────────────────────────────────────────────────────────────────
function openWeekView(year, week) {
  currentWeek = { year, week };
  const monday = getMondayOfWeek(year, week);
  currentDate = monday;

  // Show week view header, hide overview header
  document.getElementById('header-overview').style.display = 'none';
  document.getElementById('header-weekview').style.display = '';

  // Show week view content, hide overview
  document.getElementById('kw-overview-content').style.display = 'none';
  document.getElementById('week-view-content').style.display = '';

  // Show FAB
  document.getElementById('fab-btn').style.display = '';

  updateWeekViewHeader();
  loadWeekView();
}

function updateWeekViewHeader() {
  if (!currentWeek) return;
  const { year, week } = currentWeek;
  document.getElementById('weekview-kw-title').textContent =
    `KW ${String(week).padStart(2, '0')} / ${year}`;

  const monday = getMondayOfWeek(year, week);
  const sunday = getWeekDates(monday)[6];
  document.getElementById('weekview-date-range').textContent = formatDateRange(monday, sunday);

  // Update arrow button states
  const sorted = getSortedWeeks();
  const idx = sorted.findIndex(aw => aw.year === year && aw.week === week);
  document.getElementById('nav-prev-kw').disabled = idx <= 0;
  document.getElementById('nav-next-kw').disabled = idx < 0 || idx >= sorted.length - 1;
}

function navigateKW(delta) {
  if (!currentWeek) return;
  const sorted = getSortedWeeks();
  const idx = sorted.findIndex(aw => aw.year === currentWeek.year && aw.week === currentWeek.week);
  if (idx === -1) return;
  const nextIdx = idx + delta;
  if (nextIdx < 0 || nextIdx >= sorted.length) return;
  const next = sorted[nextIdx];
  openWeekView(next.year, next.week);
}

function getSortedWeeks() {
  return [...availableWeeks].sort((a, b) =>
    a.year !== b.year ? a.year - b.year : a.week - b.week
  );
}

async function loadWeekView() {
  const container = document.getElementById('week-view-content');
  container.innerHTML = '<div class="empty-state"><div class="icon">&#8987;</div><p>Lade Woche&#8230;</p></div>';

  if (!currentWeek) return;
  const { year, week } = currentWeek;

  try {
    const entries = await fetch(
      `/api/entries/week?employee=${currentEmployee.id}&year=${year}&week=${week}`
    ).then(r => r.json());

    const weekDates = getWeekDates(getMondayOfWeek(year, week));
    const days = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
    const months = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
    const today = todayStr();

    container.innerHTML = '';

    weekDates.forEach((dateStr, idx) => {
      const dayEntries = entries.filter(e => e.datum === dateStr);
      const lastBis = dayEntries.filter(e => e.bis).map(e => e.bis).sort().pop() || '';
      const isToday = dateStr === today;
      const dd = new Date(dateStr + 'T12:00:00');
      const dateLabel = `${dd.getDate()}. ${months[dd.getMonth()]}`;

      const block = document.createElement('div');
      block.className = 'week-day-block';

      const badgeClass = dayEntries.length > 0 ? 'week-day-badge' : 'week-day-badge empty';
      const headerClass = isToday ? 'week-day-header today' : 'week-day-header';
      const labelClass = isToday ? 'week-day-label today-label' : 'week-day-label';

      let entriesHtml = '';
      if (dayEntries.length === 0) {
        entriesHtml = '<div class="week-empty">Keine Einträge</div>';
      } else {
        dayEntries.forEach(e => {
          entriesHtml += `
            <div class="week-entry-row" onclick="openEditEntryById(${e.id}, ${JSON.stringify(dayEntries).replace(/"/g, '&quot;')}, '${dateStr}')">
              <div class="week-entry-time">${e.von || '?'}&#8211;${e.bis || '?'}${e.pause ? '<br><span style="font-weight:400;color:var(--text-muted);">' + e.pause + ' min Pause</span>' : ''}</div>
              <div class="week-entry-info">
                <div class="week-entry-customer">${e.kundenname || '(kein Kunde)'}</div>
                <div class="week-entry-act">${e.aktivitaet || ''}${e.kommentar ? ' &middot; ' + e.kommentar : ''}</div>
              </div>
            </div>`;
        });
      }

      block.innerHTML = `
        <div class="${headerClass}">
          <div>
            <span class="${labelClass}">${days[idx]}</span>
            <span class="week-day-date"> &middot; ${dateLabel}</span>
          </div>
          <span class="${badgeClass}">${dayEntries.length}</span>
        </div>
        <div class="week-day-entries">${entriesHtml}</div>
        <button class="week-add-btn" onclick="openNewEntry('${dateStr}', '${lastBis}')">
          + Eintrag hinzufügen
        </button>`;

      container.appendChild(block);
    });

  } catch (e) {
    container.innerHTML = '<div class="empty-state"><div class="icon">&#9888;&#65039;</div><p>Verbindungsfehler</p></div>';
  }
}

// Helper: open edit modal for an entry by id, given the list of entries for that day
function openEditEntryById(entryId, entriesJson, dateStr) {
  let entries;
  try {
    entries = typeof entriesJson === 'string' ? JSON.parse(entriesJson) : entriesJson;
  } catch (e) {
    entries = [];
  }
  const entry = entries.find(e => e.id === entryId);
  if (entry) {
    currentDate = dateStr;
    currentEntries = entries;
    openEditEntry(entry);
  }
}

// ── Date Helpers ──────────────────────────────────────────────────────────────
function todayStr() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function formatDate(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const days = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
  const months = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun',
                  'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
  return `${days[d.getDay()]}, ${d.getDate()}. ${months[d.getMonth()]} ${d.getFullYear()}`;
}

function formatShortDate(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const days = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
  const pad = n => String(n).padStart(2, '0');
  return `${days[d.getDay()]} ${pad(d.getDate())}.${pad(d.getMonth() + 1)}.`;
}

function formatDateRange(mondayStr, sundayStr) {
  const mo = new Date(mondayStr + 'T12:00:00');
  const su = new Date(sundayStr + 'T12:00:00');
  const pad = n => String(n).padStart(2, '0');
  return `Mo ${pad(mo.getDate())}.${pad(mo.getMonth() + 1)}. – So ${pad(su.getDate())}.${pad(su.getMonth() + 1)}.`;
}

function toMinutes(t) {
  if (!t) return null;
  const parts = String(t).split(':');
  if (parts.length < 2) return null;
  const h = parseInt(parts[0], 10), m = parseInt(parts[1], 10);
  if (isNaN(h) || isNaN(m)) return null;
  return h * 60 + m;
}

function getISOWeek(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const jan4 = new Date(d.getFullYear(), 0, 4);
  const startOfWeek1 = new Date(jan4);
  startOfWeek1.setDate(jan4.getDate() - ((jan4.getDay() + 6) % 7));
  const diff = d - startOfWeek1;
  const week = Math.floor(diff / (7 * 86400000)) + 1;
  if (week < 1) {
    const dec28 = new Date(d.getFullYear() - 1, 11, 28);
    return getISOWeek(dec28.toISOString().slice(0, 10));
  }
  if (week > 52) {
    const jan4Next = new Date(d.getFullYear() + 1, 0, 4);
    if (d >= jan4Next) return [d.getFullYear() + 1, 1];
  }
  return [d.getFullYear(), week];
}

function getMondayOfWeek(year, week) {
  const jan4 = new Date(year, 0, 4);
  const startOfWeek1 = new Date(jan4);
  startOfWeek1.setDate(jan4.getDate() - ((jan4.getDay() + 6) % 7));
  const monday = new Date(startOfWeek1);
  monday.setDate(startOfWeek1.getDate() + (week - 1) * 7);
  const pad = n => String(n).padStart(2, '0');
  return `${monday.getFullYear()}-${pad(monday.getMonth() + 1)}-${pad(monday.getDate())}`;
}

function getWeekDates(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const day = d.getDay() === 0 ? 7 : d.getDay();
  const monday = new Date(d);
  monday.setDate(d.getDate() - (day - 1));
  const days = [];
  for (let i = 0; i < 7; i++) {
    const dd = new Date(monday);
    dd.setDate(monday.getDate() + i);
    const pad = n => String(n).padStart(2, '0');
    days.push(`${dd.getFullYear()}-${pad(dd.getMonth() + 1)}-${pad(dd.getDate())}`);
  }
  return days;
}

// ── Modal ────────────────────────────────────────────────────────────────────
function openNewEntry(dateStr, defaultVon) {
  if (dateStr) {
    currentDate = dateStr;
    // Try to set currentEntries from the week view data for this day
    // (we refresh from server anyway on save, so currentEntries here is just for defaultVon)
    currentEntries = [];
  }
  editingEntryId = null;
  document.getElementById('modal-title').textContent = 'Neuer Eintrag';
  document.getElementById('delete-btn').style.display = 'none';
  document.getElementById('entry-form').reset();
  document.getElementById('f-kunden-id').value = '';
  document.getElementById('f-pause').value = '0';
  document.getElementById('f-akt-code').value = '';
  clearPauseBtns();
  document.getElementById('f-kundenname').value = '';
  document.getElementById('customer-results').style.display = 'none';
  document.getElementById('f-von').value = defaultVon || '07:00';
  document.getElementById('f-bis').value = '';
  document.getElementById('entry-modal').classList.add('open');
}

function openEditEntry(entry) {
  editingEntryId = entry.id;
  document.getElementById('modal-title').textContent = 'Eintrag bearbeiten';
  document.getElementById('delete-btn').style.display = 'block';
  document.getElementById('f-kundenname').value = entry.kundenname || '';
  document.getElementById('f-kunden-id').value = entry.kunden_id || '';
  document.getElementById('f-von').value = entry.von || '';
  document.getElementById('f-bis').value = entry.bis || '';
  document.getElementById('f-pause').value = entry.pause || 0;
  document.getElementById('f-kommentar').value = entry.kommentar || '';
  document.getElementById('customer-results').style.display = 'none';

  const sel = document.getElementById('f-aktivitaet');
  for (let opt of sel.options) {
    if (opt.value === entry.aktivitaet) { sel.value = opt.value; break; }
  }

  clearPauseBtns();
  document.querySelectorAll('.pause-btn').forEach(btn => {
    if (parseInt(btn.textContent) === parseInt(entry.pause)) {
      btn.classList.add('active');
    }
  });

  document.getElementById('entry-modal').classList.add('open');
}

function closeModal() {
  document.getElementById('entry-modal').classList.remove('open');
  document.getElementById('customer-results').style.display = 'none';
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('entry-modal')) closeModal();
}

// ── Customer search ───────────────────────────────────────────────────────────
function searchCustomers(query) {
  const results = document.getElementById('customer-results');
  if (!query || query.length < 1) { results.style.display = 'none'; return; }
  const q = query.toLowerCase();
  const matches = allCustomers.filter(c => c.name.toLowerCase().includes(q)).slice(0, 12);
  if (!matches.length) { results.style.display = 'none'; return; }

  results.innerHTML = '';
  matches.forEach(c => {
    const item = document.createElement('div');
    item.className = 'customer-result-item';
    item.textContent = c.name;
    item.onclick = () => {
      document.getElementById('f-kundenname').value = c.name;
      document.getElementById('f-kunden-id').value = c.id;
      results.style.display = 'none';
    };
    results.appendChild(item);
  });
  results.style.display = 'block';
}

document.addEventListener('click', e => {
  if (!e.target.closest('.customer-search-wrap')) {
    const r = document.getElementById('customer-results');
    if (r) r.style.display = 'none';
  }
});

// ── Pause ────────────────────────────────────────────────────────────────────
function setPause(minutes) {
  document.getElementById('f-pause').value = minutes;
  clearPauseBtns();
  document.querySelectorAll('.pause-btn').forEach(btn => {
    if (parseInt(btn.textContent) === minutes) btn.classList.add('active');
  });
}

function clearPauseBtns() {
  document.querySelectorAll('.pause-btn').forEach(b => b.classList.remove('active'));
}

// Zeit auf 5-Minuten-Schritte runden
function snapTo5(el) {
  if (!el.value) return;
  let [h, m] = el.value.split(':').map(Number);
  if (isNaN(h) || isNaN(m)) return;
  m = Math.round(m / 5) * 5;
  if (m === 60) { m = 0; h = (h + 1) % 24; }
  const pad = n => String(n).padStart(2, '0');
  el.value = `${pad(h)}:${pad(m)}`;
}

// ── Activity select ───────────────────────────────────────────────────────────
document.addEventListener('change', e => {
  if (e.target.id === 'f-aktivitaet') {
    const sel = e.target;
    const opt = sel.options[sel.selectedIndex];
    document.getElementById('f-akt-code').value = opt.dataset.code || '';
    const ABWESENHEIT = ['Urlaub', 'Krankheit', 'Feiertag', 'Ausgleichsruhetag'];
    if (ABWESENHEIT.includes(sel.value)) {
      document.getElementById('f-von').value = '01:00';
      document.getElementById('f-bis').value = '09:00';
      setPause(0);
    }
  }
});

// ── Save / Delete ────────────────────────────────────────────────────────────
async function saveEntry(e) {
  e.preventDefault();
  const btn = document.getElementById('save-btn');
  btn.innerHTML = '<span class="spinner"></span>';
  btn.disabled = true;

  const payload = {
    employee_id: currentEmployee.id,
    datum: currentDate,
    kundenname: document.getElementById('f-kundenname').value.trim() || null,
    kunden_id: parseInt(document.getElementById('f-kunden-id').value) || null,
    aktivitaet: document.getElementById('f-aktivitaet').value || null,
    akt_code: parseInt(document.getElementById('f-akt-code').value) || null,
    von: document.getElementById('f-von').value || null,
    bis: document.getElementById('f-bis').value || null,
    pause: parseInt(document.getElementById('f-pause').value) || 0,
    kommentar: document.getElementById('f-kommentar').value.trim() || null,
  };

  try {
    const url = editingEntryId ? `/api/entries/${editingEntryId}` : '/api/entries';
    const method = editingEntryId ? 'PUT' : 'POST';
    await fetch(url, {
      method,
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    closeModal();
    // Reload the week view to reflect changes
    if (currentWeek) loadWeekView();
    showToast(editingEntryId ? 'Eintrag gespeichert ✓' : 'Eintrag hinzugefügt ✓');
  } catch (err) {
    showToast('Fehler beim Speichern');
  } finally {
    btn.innerHTML = 'Speichern';
    btn.disabled = false;
  }
}

async function deleteEntry() {
  if (!editingEntryId) return;
  if (!confirm('Eintrag löschen?')) return;
  await fetch(`/api/entries/${editingEntryId}`, { method: 'DELETE' });
  closeModal();
  if (currentWeek) loadWeekView();
  showToast('Eintrag gelöscht');
}

// ── Toast ─────────────────────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
