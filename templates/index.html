<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1a56db">
<title>Stundenerfassung</title>
<style>
  :root {
    --primary: #1a56db;
    --primary-dark: #1240a8;
    --primary-light: #e8f0fe;
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1a1f36;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --red: #ef4444;
    --green: #10b981;
    --radius: 14px;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overscroll-behavior: none;
  }

  /* ââ SCREENS ââ */
  .screen { display: none; flex-direction: column; min-height: 100vh; }
  .screen.active { display: flex; }

  /* ââ EMPLOYEE SELECT ââ */
  #screen-employee {
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    background: linear-gradient(160deg, #1a56db 0%, #0c3399 100%);
  }

  .logo-area { text-align: center; margin-bottom: 48px; }
  .logo-area h1 { font-size: 26px; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
  .logo-area p { color: rgba(255,255,255,0.7); margin-top: 6px; font-size: 15px; }

  .employee-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: 100%;
    max-width: 340px;
  }

  .employee-btn {
    background: rgba(255,255,255,0.12);
    border: 1.5px solid rgba(255,255,255,0.25);
    border-radius: var(--radius);
    padding: 20px 16px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    color: #fff;
  }
  .employee-btn:active { transform: scale(0.96); background: rgba(255,255,255,0.22); }
  .employee-btn .kuerzel { font-size: 22px; font-weight: 700; display: block; }
  .employee-btn .fullname { font-size: 12px; color: rgba(255,255,255,0.75); margin-top: 4px; display: block; }

  /* ââ MAIN APP ââ */
  #screen-main { background: var(--bg); }

  /* Header */
  .app-header {
    background: var(--primary);
    padding: 0;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 10px;
  }

  .header-top .app-title {
    font-size: 17px;
    font-weight: 600;
    color: rgba(255,255,255,0.85);
  }

  .employee-chip {
    background: rgba(255,255,255,0.2);
    border: none;
    color: #fff;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  .employee-chip:active { background: rgba(255,255,255,0.3); }

  /* Date Navigation */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px 14px;
  }

  .nav-btn {
    background: rgba(255,255,255,0.15);
    border: none;
    color: #fff;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  .nav-btn:active { background: rgba(255,255,255,0.3); }

  .date-display {
    text-align: center;
    color: #fff;
    cursor: pointer;
  }
  .date-display .date-main {
    font-size: 18px;
    font-weight: 700;
    display: block;
  }
  .date-display .date-sub {
    font-size: 12px;
    color: rgba(255,255,255,0.75);
    margin-top: 2px;
    display: block;
  }

  .today-btn {
    background: rgba(255,255,255,0.15);
    border: none;
    color: rgba(255,255,255,0.9);
    padding: 4px 10px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 4px;
    display: inline-block;
  }

  /* Week unavailable banner */
  .week-unavail-banner {
    background: #fef3c7;
    color: #92400e;
    font-size: 13px;
    font-weight: 500;
    padding: 8px 16px;
    text-align: center;
    display: none;
  }
  .week-unavail-banner.show { display: block; }

  /* Content */
  .content {
    flex: 1;
    padding: 16px;
    padding-bottom: 100px;
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 15px; }

  /* No weeks message */
  .no-weeks-msg {
    text-align: center;
    padding: 60px 24px;
    color: var(--text-muted);
  }
  .no-weeks-msg .icon {
    font-size: 48px;
    margin-bottom: 16px;
  }
  .no-weeks-msg p {
    font-size: 15px;
    line-height: 1.6;
  }

  /* Entry cards */
  .entry-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
    display: flex;
    gap: 12px;
    align-items: flex-start;
    cursor: pointer;
    transition: transform 0.1s;
    -webkit-user-select: none;
    user-select: none;
  }
  .entry-card:active { transform: scale(0.985); }

  .entry-time {
    min-width: 62px;
    text-align: center;
    padding-top: 2px;
  }
  .entry-time .time-range {
    font-size: 13px;
    font-weight: 700;
    color: var(--primary);
    display: block;
  }
  .entry-time .time-pause {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 3px;
    display: block;
  }

  .entry-divider {
    width: 1px;
    align-self: stretch;
    background: var(--border);
  }

  .entry-info { flex: 1; min-width: 0; }
  .entry-customer {
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .entry-activity {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 3px;
  }
  .entry-comment {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-style: italic;
  }

  .synced-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
    margin-top: 4px;
    flex-shrink: 0;
  }
  .unsynced-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--border);
    margin-top: 4px;
    flex-shrink: 0;
  }

  /* FAB */
  .fab {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: var(--primary);
    border: none;
    color: #fff;
    font-size: 30px;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(26,86,219,0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .fab:active { transform: scale(0.92); box-shadow: 0 2px 10px rgba(26,86,219,0.4); }

  /* ââ MODAL / BOTTOM SHEET ââ */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 300;
    align-items: flex-end;
  }
  .modal-overlay.open { display: flex; }

  .modal-sheet {
    background: var(--card);
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-height: 92vh;
    overflow-y: auto;
    padding: 0 0 40px;
    animation: slideUp 0.25s ease-out;
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .modal-handle {
    width: 40px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 12px auto 8px;
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 20px 16px;
    border-bottom: 1px solid var(--border);
  }
  .modal-header h2 { font-size: 18px; font-weight: 700; }
  .close-btn {
    background: var(--bg);
    border: none;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
  }

  .modal-body { padding: 20px; }

  /* Form */
  .form-group { margin-bottom: 18px; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  input[type="text"],
  input[type="time"],
  select,
  textarea {
    width: 100%;
    padding: 14px 16px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 16px;
    font-family: inherit;
    background: #fff;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
    appearance: none;
    -webkit-appearance: none;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(26,86,219,0.1);
  }

  textarea { resize: none; height: 80px; }

  /* Customer search */
  .customer-search-wrap { position: relative; }
  #customer-results {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: var(--card);
    border: 1.5px solid var(--primary);
    border-top: none;
    border-radius: 0 0 10px 10px;
    max-height: 220px;
    overflow-y: auto;
    z-index: 50;
    display: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  }
  .customer-result-item {
    padding: 13px 16px;
    cursor: pointer;
    font-size: 15px;
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }
  .customer-result-item:last-child { border-bottom: none; }
  .customer-result-item:active { background: var(--primary-light); }

  /* Time row */
  .time-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  /* Pause quick buttons */
  .pause-row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-top: 6px;
  }
  .pause-btn {
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 10px 4px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    color: var(--text);
  }
  .pause-btn.active {
    background: var(--primary-light);
    border-color: var(--primary);
    color: var(--primary);
  }
  .pause-btn:active { transform: scale(0.94); }

  /* Action buttons */
  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }

  .btn-primary {
    flex: 1;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 16px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s;
  }
  .btn-primary:active { background: var(--primary-dark); }

  .btn-danger {
    background: #fff;
    color: var(--red);
    border: 1.5px solid var(--red);
    border-radius: 12px;
    padding: 16px 20px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s;
  }
  .btn-danger:active { background: #fef2f2; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1a1f36;
    color: #fff;
    padding: 12px 24px;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 500;
    z-index: 999;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Loading spinner */
  .spinner {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Date picker hidden input */
  #date-picker-input {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
    pointer-events: none;
  }

  /* ââ BOTTOM NAV ââ */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    display: flex;
    z-index: 150;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .nav-tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px 0 8px;
    cursor: pointer;
    border: none;
    background: none;
    color: var(--text-muted);
    font-size: 11px;
    font-family: inherit;
    gap: 3px;
    transition: color 0.15s;
  }
  .nav-tab.active { color: var(--primary); }
  .nav-tab .nav-icon { font-size: 20px; line-height: 1; }

  /* ââ WEEK VIEW ââ */
  /* KW selector row */
  .kw-selector {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 12px 16px 4px;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .kw-selector::-webkit-scrollbar { display: none; }

  .kw-chip {
    flex-shrink: 0;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 20px;
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    color: var(--text);
    white-space: nowrap;
    transition: all 0.15s;
  }
  .kw-chip.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }
  .kw-chip:active { transform: scale(0.94); }

  .week-day-block {
    background: var(--card);
    border-radius: var(--radius);
    margin-bottom: 10px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .week-day-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
  }
  .week-day-header.today { background: var(--primary-light); }
  .week-day-label { font-size: 14px; font-weight: 700; color: var(--text); }
  .week-day-label.today-label { color: var(--primary); }
  .week-day-date { font-size: 12px; color: var(--text-muted); }
  .week-day-badge {
    background: var(--primary);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    min-width: 22px;
    text-align: center;
  }
  .week-day-badge.empty { background: var(--border); color: var(--text-muted); }
  .week-day-entries { padding: 8px 12px 10px; }
  .week-entry-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .week-entry-row:last-child { border-bottom: none; }
  .week-entry-time { color: var(--primary); font-weight: 700; min-width: 80px; font-size: 12px; }
  .week-entry-info { flex: 1; min-width: 0; }
  .week-entry-customer { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .week-entry-act { font-size: 11px; color: var(--text-muted); }
  .week-empty { padding: 10px 0; color: var(--text-muted); font-size: 13px; text-align: center; }
  .week-add-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    padding: 10px;
    background: none;
    border: none;
    color: var(--primary);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    border-top: 1px solid var(--border);
  }

  /* ââ SYNC STATUS ââ */
  .status-section { margin-bottom: 20px; }
  .status-emp-header {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    padding: 0 4px;
  }
  .status-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 8px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .status-kw { font-size: 15px; font-weight: 700; }
  .status-count {
    background: #fef3c7;
    color: #92400e;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 10px;
  }
  .status-all-synced {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }
  .status-all-synced .icon { font-size: 48px; margin-bottom: 12px; }
  .status-refresh-btn {
    display: block;
    margin: 0 auto 16px;
    background: var(--primary-light);
    color: var(--primary);
    border: none;
    border-radius: 10px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
</style>
</head>
<body>

<!-- ââ EMPLOYEE SELECTION SCREEN ââ -->
<div id="screen-employee" class="screen active">
  <div class="logo-area">
    <h1>Stundenerfassung</h1>
    <p>WÃ¤hle dein KÃ¼rzel</p>
  </div>
  <div class="employee-grid" id="employee-grid">
    <!-- filled by JS -->
  </div>
</div>

<!-- ââ MAIN APP SCREEN ââ -->
<div id="screen-main" class="screen">
  <div class="app-header">
    <div class="header-top">
      <span class="app-title">Stundenerfassung</span>
      <button class="employee-chip" id="change-employee-btn" onclick="changeEmployee()">
        <span id="header-kuerzel">--</span>
      </button>
    </div>
    <div class="date-nav">
      <button class="nav-btn" onclick="changeDay(-1)">â¹</button>
      <div class="date-display" onclick="openDatePicker()">
        <span class="date-main" id="display-date">--</span>
        <span class="date-sub" id="display-week">--</span>
        <span class="today-btn" id="today-btn" onclick="goToToday(event)">Heute</span>
      </div>
      <button class="nav-btn" onclick="changeDay(1)">âº</button>
    </div>
    <div id="week-unavail-banner" class="week-unavail-banner">â  Diese Woche hat kein Stundenblatt</div>
  </div>

  <div class="content" id="entries-list">
    <div class="empty-state">
      <div class="icon">ð</div>
      <p>Lade EintrÃ¤geâ¦</p>
    </div>
  </div>

  <!-- Week view (hidden by default) -->
  <div class="content" id="week-list" style="display:none"></div>

  <!-- Sync status view (hidden by default) -->
  <div class="content" id="status-list" style="display:none">
    <button class="status-refresh-btn" onclick="loadSyncStatus()">â» Aktualisieren</button>
    <div id="status-content"></div>
  </div>

  <button class="fab" id="fab-btn" onclick="openNewEntry()">+</button>
  <input type="date" id="date-picker-input" onchange="onDatePicked(this.value)">

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <button class="nav-tab active" id="tab-day" onclick="switchTab('day')">
      <span class="nav-icon">ð</span>Tag
    </button>
    <button class="nav-tab" id="tab-week" onclick="switchTab('week')">
      <span class="nav-icon">ð</span>Woche
    </button>
    <button class="nav-tab" id="tab-status" onclick="switchTab('status')">
      <span class="nav-icon">ð</span>Sync
    </button>
  </nav>
</div>

<!-- ââ ENTRY MODAL ââ -->
<div class="modal-overlay" id="entry-modal" onclick="handleOverlayClick(event)">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <h2 id="modal-title">Neuer Eintrag</h2>
      <button class="close-btn" onclick="closeModal()">â</button>
    </div>
    <div class="modal-body">
      <form id="entry-form" onsubmit="saveEntry(event)">

        <!-- Customer -->
        <div class="form-group">
          <label>Kundenname</label>
          <div class="customer-search-wrap">
            <input type="text" id="f-kundenname" placeholder="Kunden suchenâ¦"
                   autocomplete="off" oninput="searchCustomers(this.value)"
                   onfocus="searchCustomers(this.value)">
            <div id="customer-results"></div>

function isWeekAvailable(dateStr) {
  if (!availableWeeks.length) return false;
  const [y, w] = getISOWeek(dateStr);

function getMondayOfWeek(year, week) {
  const jan4 = new Date(year, 0, 4);
  const startOfWeek1 = new Date(jan4);
  startOfWeek1.setDate(jan4.getDate() - ((jan4.getDay() + 6) % 7));
  const monday = new Date(startOfWeek1);
  monday.setDate(startOfWeek1.getDate() + (week - 1) * 7);
  return monday.toISOString().slice(0, 10);
}

function todayStr() {

function formatDate(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const days = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
  const months = ['Jan', 'Feb', 'MÃ¤r', 'Apr', 'Mai', 'Jun',
                  'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
  return `${days[d.getDay()]}, ${d.getDate()}. ${months[d.getMonth()]} ${d.getFullYear()}`;
}

function getKW(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const jan4 = new Date(d.getFullYear(), 0, 4);
  const startOfWeek1 = new Date(jan4);
  startOfWeek1.setDate(jan4.getDate() - ((jan4.getDay() + 6) % 7));
  const diff = d - startOfWeek1;
  const kw = Math.floor(diff / (7 * 86400000)) + 1;
  return `KW ${kw} / ${d.getFullYear()}`;
}

// ââ Week View âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
function getWeekDates(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const day = d.getDay() === 0 ? 7 : d.getDay();
  const monday = new Date(d);
  monday.setDate(d.getDate() - (day - 1));
  const days = [];
  for (let i = 0; i < 7; i++) {
    const dd = new Date(monday);
    dd.setDate(monday.getDate() + i);
    days.push(dd.toISOString().slice(0, 10));
  }
  return days;
}

function getISOWeek(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const iso = d.toISOString ? null : null;
  const jan4 = new Date(d.getFullYear(), 0, 4);
  const startOfWeek1 = new Date(jan4);
  startOfWeek1.setDate(jan4.getDate() - ((jan4.getDay() + 6) % 7));
  const diff = d - startOfWeek1;
  const week = Math.floor(diff / (7 * 86400000)) + 1;
  if (week < 1) {
    const dec28 = new Date(d.getFullYear() - 1, 11, 28);
    return getISOWeek(dec28.toISOString().slice(0, 10));
  }
  if (week > 52) {
    const jan4Next = new Date(d.getFullYear() + 1, 0, 4);
    if (d >= jan4Next) return [d.getFullYear() + 1, 1];
  }
  return [d.getFullYear(), week];
}

// ââ Sync Status âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
async function loadSyncStatus() {
  const content = document.getElementById('status-content');
  content.innerHTML = '<div class="empty-state"><div class="icon">â³</div><p>Lade Statusâ¦</p></div>';

  try {
    const data = await fetch('/api/sync-status').then(r => r.json());

    if (!data.length) {
      content.innerHTML = `
        <div class="status-all-synced">
          <div class="icon">â</div>
          <p>Alle EintrÃ¤ge sind synchronisiert.</p>
        </div>`;
      return;
    }

    const byEmp = {};
    data.forEach(item => {
      if (!byEmp[item.employee_id]) byEmp[item.employee_id] = [];
      byEmp[item.employee_id].push(item);
    });

    content.innerHTML = '';
    for (const [empId, weeks] of Object.entries(byEmp)) {
      const section = document.createElement('div');
      section.className = 'status-section';
      section.innerHTML = `<div class="status-emp-header">${empId}</div>`;

        card.innerHTML = `
          <span class="status-kw">${w.kw_label}</span>
          <span class="status-count">${w.unsynced_count} nicht synchronisiert</span>`;
        section.appendChild(card);
      });

      content.appendChild(section);
    }
  } catch (e) {
    content.innerHTML = '<div class="empty-state"><div class="icon">â ï¸</div><p>Verbindungsfehler</p></div>';
  }
}

    }
  });

  document.getElementById('entry-modal').classList.add('open');
}

function closeModal() {
  document.getElementById('entry-modal').classList.remove('open');
  document.getElementById('customer-results').style.display = 'none';
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('entry-modal')) closeModal();
}

// ââ Customer search âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
function searchCustomers(query) {
  const results = document.getElementById('customer-results');
  if (!query || query.length < 1) { results.style.display = 'none'; return; }
  const q = query.toLowerCase();
  const matches = allCustomers.filter(c => c.name.toLowerCase().includes(q)).slice(0, 12);
  if (!matches.length) { results.style.display = 'none'; return; }

  results.innerHTML = '';
  matches.forEach(c => {
    const item = document.createElement('div');
    item.className = 'customer-result-item';
    item.textContent = c.name;
    item.onclick = () => {
      document.getElementById('f-kundenname').value = c.name;
      document.getElementById('f-kunden-id').value = c.id;
      results.style.display = 'none';
    };
    results.appendChild(item);
  });
  results.style.display = 'block';
}

document.addEventListener('click', e => {
  if (!e.target.closest('.customer-search-wrap')) {
    const r = document.getElementById('customer-results');
    if (r) r.style.display = 'none';
  }
});

// ââ Pause ââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
function setPause(minutes) {
  document.getElementById('f-pause').value = minutes;
  clearPauseBtns();
  document.querySelectorAll('.pause-btn').forEach(btn => {
    if (parseInt(btn.textContent) === minutes) btn.classList.add('active');
  });
}

function clearPauseBtns() {
  document.querySelectorAll('.pause-btn').forEach(b => b.classList.remove('active'));
}

// ââ Activity select âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
document.addEventListener('change', e => {
  if (e.target.id === 'f-aktivitaet') {
    const sel = e.target;
    const opt = sel.options[sel.selectedIndex];
    document.getElementById('f-akt-code').value = opt.dataset.code || '';
  }
});

// ââ Save / Delete ââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
async function saveEntry(e) {
  e.preventDefault();
  const btn = document.getElementById('save-btn');
  btn.innerHTML = '<span class="spinner"></span>';
  btn.disabled = true;

  const payload = {
    employee_id: currentEmployee.id,
    datum: currentDate,
    kundenname: document.getElementById('f-kundenname').value.trim() || null,
    kunden_id: parseInt(document.getElementById('f-kunden-id').value) || null,
    aktivitaet: document.getElementById('f-aktivitaet').value || null,
    akt_code: parseInt(document.getElementById('f-akt-code').value) || null,
    von: document.getElementById('f-von').value || null,
    bis: document.getElementById('f-bis').value || null,
    pause: parseInt(document.getElementById('f-pause').value) || 0,
    kommentar: document.getElementById('f-kommentar').value.trim() || null,
  };

  try {
    const url = editingEntryId ? `/api/entries/${editingEntryId}` : '/api/entries';
    const method = editingEntryId ? 'PUT' : 'POST';
    await fetch(url, {
      method,
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    closeModal();
    loadEntries();
    showToast(editingEntryId ? 'Eintrag gespeichert â' : 'Eintrag hinzugefÃ¼gt â');
  } catch (err) {
    showToast('Fehler beim Speichern');
  } finally {
    btn.innerHTML = 'Speichern';
    btn.disabled = false;
  }
}

async function deleteEntry() {
  if (!editingEntryId) return;
  if (!confirm('Eintrag lÃ¶schen?')) return;
  await fetch(`/api/entries/${editingEntryId}`, { method: 'DELETE' });
  closeModal();
  loadEntries();
  showToast('Eintrag gelÃ¶scht');
}

// ââ Toast âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
